services:
  backend:
    container_name: backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    ports:
      - ${PORT:-3000}:3000
    depends_on:
      - postgres
    restart: always
    networks:
      - app-network

  postgres:
    container_name: postgres
    image: postgres:12
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/postgres/data:/var/lib/postgresql/data
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    restart: always
    networks:
      - app-network

  frontend:
    container_name: frontend
    build:
      context: ./frontend/front
      dockerfile: Dockerfile
    env_file:
      - ./frontend/front/.env
    ports:
      - ${FRONTEND_PORT:-80}:80
    depends_on:
      - backend
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
    name: app-network