services:
   main:
     container_name: main
     build:
       context: .
     env_file:
       - .env
     ports:
       - ${PORT}:3000
     depends_on:
       - postgres
     restart: always
   postgres:
     container_name: postgres
     image: postgres:12
     env_file:
       - .env
     volumes:
       - ./postgres/data:/var/lib/postgresql/data
     ports:
       - ${POSTGRES_PORT}:5432
     restart: always
